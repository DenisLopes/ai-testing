name: CI - AI Testing

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar testes com pytest
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python -m pytest tests/ -v --tb=short --html=relatorioshtml/pytest_report.html --self-contained-html

      - name: Gerar relatório de evidência
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python scripts/gerar_relatorio.py

      - name: Upload dos artefatos de relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-${{ github.run_number }}
          path: |
            relatorioshtml/
            relatoriosjson/
            evidencias/

      - name: Publicar relatório no GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: relatorioshtml
          destination_dir: relatorio
